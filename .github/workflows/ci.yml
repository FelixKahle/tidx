# The checks a change must pass before it reaches `main`: the four of the README on the current stable toolchain,
# and a build on the oldest toolchain the manifest promises.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Document
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  minimum-rust:
    name: Minimum Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain the manifest names
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')"
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
      - name: Test
        run: cargo test --locked
        env:
          RUSTFLAGS: -D warnings
